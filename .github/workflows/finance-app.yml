name: Finance App APK

on:
  push:
    paths:
      - "finance-app/**"
      - ".github/workflows/finance-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes e build do APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Preparar APK
        id: apk
        run: |
          cp app/build/outputs/apk/release/app-release.apk MinhasFinancas.apk
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: MinhasFinancas-apk
          path: finance-app/MinhasFinancas.apk
          if-no-files-found: error

      # Publica apenas quando o workflow é executado manualmente (Actions > Finance App APK > Run workflow).
      # Pushes comuns só compilam e testam, gerando o APK como artefato.
      - name: Publicar release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "build-${{ github.run_number }}" MinhasFinancas.apk \
            --target "${{ github.sha }}" \
            --title "Minhas Finanças v${{ steps.apk.outputs.version }} (build ${{ github.run_number }})" \
            --notes "${NOTES:-Build manual de ${{ github.sha }}}" \
            --latest
