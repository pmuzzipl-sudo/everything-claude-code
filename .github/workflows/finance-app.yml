name: Finance App APK

on:
  push:
    paths:
      - "finance-app/**"
      - ".github/workflows/finance-app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes e build do APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: MinhasFinancas-apk
          path: finance-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
